spring.application.name=whatsapp-ai-auto-reply
server.port=${PORT:8080}

# Configure these as environment variables. Do not commit real tokens or API keys.
WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:change-me}
WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:}
WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:}
WHATSAPP_GRAPH_API_VERSION=${WHATSAPP_GRAPH_API_VERSION:v23.0}

GEMINI_API_KEY=${GEMINI_API_KEY:}
GEMINI_MODEL=${GEMINI_MODEL:gemini-2.5-flash}
BUSINESS_INSTRUCTIONS=${BUSINESS_INSTRUCTIONS:You are a helpful, concise customer support assistant. If you do not know an answer, say so and offer to connect the customer with a human.}
